# Continuous integration: type checks, API tests against a real PostgreSQL, and production builds.
name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: spine_app, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: spine_advisory_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spine_app" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: "postgres://spine_app:ci-password@localhost:5432/spine_advisory_test" }
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
