# Nginx in front of the website (Angular SSR server on 127.0.0.1:4200), with HTTPS.
# Certificates: e.g. Let's Encrypt via certbot (`certbot --nginx -d spineadvisory.com -d www.spineadvisory.com`).
# Security headers (CSP, frame, content-type, referrer) are set by the Node servers; HSTS is set here and there.

server {
  listen 80;
  listen [::]:80;
  server_name spineadvisory.com www.spineadvisory.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://spineadvisory.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.spineadvisory.com;
  ssl_certificate     /etc/letsencrypt/live/spineadvisory.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/spineadvisory.com/privkey.pem;
  return 301 https://spineadvisory.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name spineadvisory.com;

  ssl_certificate     /etc/letsencrypt/live/spineadvisory.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/spineadvisory.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # CV uploads are capped at 5 MB and media at 8 MB by the API; allow a little overhead.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
